name: DreamStore Pull Request Checks

on:
  push:
    branches:
      - fix/launch-checkout-download-safety
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install from committed lockfile
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run lint
      - name: Production Vite build
        run: bun run build
      - name: Static 5MB storage and security contract checks
        run: bun test tests/secure-deliverables-contract.test.mjs

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install emulator CLI and Firebase security test harness
        run: npm install --no-save --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@5

      - name: Test actual Firestore and Storage security rules (no live Firebase project)
        run: npx firebase-tools emulators:exec --project demo-dreamstore-authorization --config firebase.emulator.json --only firestore,storage "node --test tests/firebase-security-emulator.test.mjs"
