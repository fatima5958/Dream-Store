name: DreamStore Pull Request Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install from committed lockfile
        run: bun install --frozen-lockfile
      - name: TypeScript typecheck
        run: bun run lint
      - name: Server auth and failure-path regression tests
        run: npm run test:server
      - name: Backend V2 staging authentication, profiles and release guards
        run: npm run test:v2
      - name: Offline private cloud staging preflight regression tests
        run: npm run test:v2:private-preflight
      - name: Production Vite build
        run: bun run build
      - name: Static 5MB storage, launch onboarding and safety contracts
        run: bun test tests/secure-deliverables-contract.test.mjs tests/store-launch-contract.test.mjs

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install emulator CLI and Firebase security test harness
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund firebase-tools@14 @firebase/rules-unit-testing@5

      - name: Test actual Firestore and Storage security rules (no live Firebase project)
        run: npx firebase-tools emulators:exec --project demo-dreamstore-authorization --config firebase.emulator.json --only firestore,storage "node --test tests/firebase-security-emulator.test.mjs"

      - name: Test isolated V2 Auth, named Firestore database, Storage and API integration
        run: >-
          npx firebase-tools emulators:exec --project demo-dreamstore-v2
          --config firebase.v2.emulator.json --only auth,firestore,storage
          "DREAMSTORE_V2_STAGING=1 DREAMSTORE_V2_PROJECT_ID=demo-dreamstore-v2 SUPER_ADMIN_UID=v2-admin FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 FIREBASE_STORAGE_EMULATOR_HOST=127.0.0.1:9199 npm run test:v2:emulator"

  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Install headless Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: Build production UI for Chromium flow testing
        run: bun run build
      - name: Start isolated production Vite preview (Firebase Admin credentials not required)
        run: |
          nohup bunx vite preview --host 127.0.0.1 --port 3000 > /tmp/dreamstore-browser-smoke.log 2>&1 &
          for attempt in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/dreamstore-browser-smoke.log
          exit 1
      - name: Test visitor, signup, guest permissions, store discovery and mobile
        run: node --test tests/public-beta-browser.test.mjs
      - name: Show server logs if failed
        if: failure()
        run: tail -160 /tmp/dreamstore-browser-smoke.log || true

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the same production image used for deployment
        run: docker build --tag dreamstore:ci .
      - name: Build separate Backend V2 staging candidate
        run: docker build --file Dockerfile.backend-v2 --tag dreamstore-v2:staging-candidate .
      - name: Verify V2 candidate refuses unconfigured startup
        run: |
          if docker run --rm dreamstore-v2:staging-candidate; then
            echo "Backend V2 unexpectedly started without explicit isolated staging configuration."
            exit 1
          fi
      - name: Check production container health and paid checkout default
        run: |
          docker run -d --name dreamstore-ci -p 127.0.0.1:18080:8080 dreamstore:ci
          trap 'docker logs dreamstore-ci; docker rm -f dreamstore-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/api/health; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          # Liveness alone does not mean the application has Firebase/secret access.
          # The readiness endpoint must fail closed without production credentials.
          response=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/ready)
          test "$response" = 503
