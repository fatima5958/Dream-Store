name: Clean up fully archived fix branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-merged-branches.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'fatima5958/Dream-Store' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify every obsolete branch tip is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for branch in \
            fix/launch-checkout-download-safety \
            fix/launch-readiness \
            fix/production-deployment-container \
            fix/qa-workflows \
            fix/role-onboarding-invalid-session
          do
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            if ! git merge-base --is-ancestor "refs/remotes/origin/${branch}" origin/main; then
              echo "::error::Refusing cleanup: ${branch} is not merged into main history"
              exit 1
            fi
            echo "Verified: ${branch} preserved in main history"
          done
      - name: Delete only the five verified redundant branches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for branch in \
            fix/launch-checkout-download-safety \
            fix/launch-readiness \
            fix/production-deployment-container \
            fix/qa-workflows \
            fix/role-onboarding-invalid-session
          do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted obsolete branch ${branch}"
          done
